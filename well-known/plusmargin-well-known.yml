findings:
- id: hsts-header-name-mangled
  severity: medium
  detail: >-
    The origin emits its security headers with the header NAME truncated into the value:
    responses carry `ssl: Strict-Transport-Security: max-age=31536000; includeSubdomains;
    preload` and `sameorig: X-Frame-Options: SAMEORIGIN` instead of the real
    `Strict-Transport-Security` and `X-Frame-Options` headers. As deployed, no browser or agent
    enforces HSTS or frame-options on plusmargin.com — the policy was configured but is being
    sent under nonexistent header names. This is why security/plusmargin-domain-security.yml
    records hsts:false against a server that clearly intended to set it.
  evidence:
  - url: https://plusmargin.com/
    status: 200
  - url: https://plusmargin.com/wp-json/wp/v2/posts?per_page=2
    status: 200
- id: no-developer-surface
  severity: informational
  detail: >-
    No developer, API, docs or pricing page exists on the site. The published page sitemap
    contains exactly four URLs — /, /about/, /contact/, /privacy-policy/ — and /pricing/,
    /services/, /terms/ and /blog/ all 404. There is no product API to document.
  evidence:
  - url: https://plusmargin.com/page-sitemap.xml
    status: 200
  - url: https://plusmargin.com/pricing/
    status: 404
