source: >-
  live unauthenticated GET of /.well-known/*, /llms.txt and common contract paths on
  https://plusmargin.com — the only host PlusMargin resolves (api., app., developer., docs.,
  dev. and portal.plusmargin.com are all NXDOMAIN)
summary: >-
  PlusMargin publishes NO /.well-known/ discovery surface and no llms.txt. Every probed path
  returns HTTP 404 rendered as the site's WordPress 404 HTML page (~74 KB of text/html), not a
  document — including the two A2A agent-card paths, security.txt, OIDC/OAuth metadata,
  api-catalog and ai-plugin.json. No WellKnown, SecurityTxt, LLMsTxt or AgentCard pointer is
  emitted from this probe, because a 404 HTML shell is an absence, not a presence. The one
  machine-readable surface the site DOES serve is the stock WordPress REST API discovery
  document at /wp-json (HTTP 200, application/json, 237 routes), which the homepage advertises
  in a `Link: <https://plusmargin.com/wp-json/>; rel="https://api.w.org/"` response header.
