apis:
- aid: plusmargin:wordpress-rest-api
  name: PlusMargin WordPress REST API
  description: >-
    The stock WordPress REST API exposed by PlusMargin's marketing site. The root discovery
    document at /wp-json self-identifies as "Plus Margin" (url https://plusmargin.com) and
    registers 237 routes across 11 namespaces — wp/v2 content routes plus plugin namespaces
    (yoast/v1, redirection/v1, contact-form-7/v1, wp-smush/v1, wp-block-editor/v1,
    wp-site-health/v1, wp-abilities/v1, oembed/1.0 and two site-specific namespaces). Core
    content collections — posts, pages, categories, tags, types, users, media, search — are
    readable with no credentials. This is WordPress core's API surface, not a product PlusMargin
    designed, documents, or supports; it is catalogued because it is the only callable
    machine-readable interface the company serves. Write operations and the Abilities API
    require WordPress Application Password credentials.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://plusmargin.com/wp-json
